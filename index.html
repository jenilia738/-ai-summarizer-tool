<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Summarizer Tool</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #059669; color: #059669; padding: 40px 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { font-size: 1.8rem; margin-bottom: 8px; color: #4f46e5; text-align: center; }
        p.subtitle { text-align: center; color: #6b7280; margin-bottom: 24px; font-size: 0.95rem; }
        textarea { width: 100%; height: 150px; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; resize: vertical; margin-bottom: 16px; outline: none; transition: border-color 0.2s; }
        textarea:focus { border-color: #4f46e5; }
        button { display: block; width: 100%; background-color: #4f46e5; color: white; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #4338ca; }
        .result-box { margin-top: 24px; background: #f9fafb; border: 1px solid #e5e7eb; border-left: 4px solid #4f46e5; padding: 16px; border-radius: 6px; display: none; }
        .result-box h3 { margin-bottom: 8px; color: #374151; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI Smart Summarizer</h1>
        <p class="subtitle">Paste your long articles or notes below for instant analysis.</p>
        
        <textarea id="inputText" placeholder="Paste your text here..."></textarea>
        <button onclick="runSummary()">Generate Summary</button>

        <div id="resultBox" class="result-box">
            <h3>Analysis Result:</h3>
            <p id="outputContent"></p>
        </div>
    </div>

    <script>
        function runSummary() {
            const text = document.getElementById('inputText').value;
            const resultBox = document.getElementById('resultBox');
            const outputContent = document.getElementById('outputContent');

            if (!text.trim()) {
                alert("Please enter some text first!");
                return;
            }

            // Simulated AI text processing logic
            const sentences = text.split('.').filter(s => s.trim().length > 0);
            const wordCount = text.split(/\s+/).length;
            
            outputContent.innerHTML = `<strong>Word Count:</strong> ${wordCount} words<br>` +
                                      `<strong>Sentence Count:</strong> ${sentences.length} sentences<br>` +
                                      `<strong>Key Takeaway:</strong> ${sentences[0] ? sentences[0].trim() + '.' : 'N/A'}`;
            
            resultBox.style.display = 'block';
        }
    </script>
</body>
</html>
